---
# Demo Services Role - Default Variables

project_name: callansible
project_root: /home/adam/Development/Ansible-AI-Phone-Demo
callansible_dir: "{{ project_root }}/CallAnsible"

project_user: adam
project_group: adam

# Container images
container_images:
  vllm: "docker.io/vllm/vllm-openai:latest"
  asterisk: "docker.io/andrius/asterisk:latest"
  python: "docker.io/python:3.11-slim"
  awx: "quay.io/ansible/awx:latest"
  eda: "quay.io/ansible/ansible-rulebook:latest"

# vLLM
vllm_model: "Qwen/Qwen2.5-7B-Instruct-AWQ"
vllm_quantization: "awq"
vllm_gpu_memory_utilization: "0.55"
vllm_max_model_len: 4096
vllm_port: 8000

# Asterisk
asterisk_sip_port: 5060
asterisk_ari_port: 8088
asterisk_ari_ws_port: 8089
asterisk_rtp_start: 10000
asterisk_rtp_end: 10100

# Voice Bridge
voice_bridge_port: 8080
whisper_model: "small.en"
whisper_device: "cpu"
piper_model: "en_US-lessac-medium"

# AAP
aap_https_port: 443
aap_api_port: 8043

# EDA
eda_webhook_port: 5000

# Directory structure
callansible_directories:
  - "{{ callansible_dir }}"
  - "{{ callansible_dir }}/asterisk"
  - "{{ callansible_dir }}/voice-bridge"
  - "{{ callansible_dir }}/models/piper"
  - "{{ callansible_dir }}/playbooks"
  - "{{ callansible_dir }}/audio"
  - "{{ callansible_dir }}/scripts"
  - "{{ callansible_dir }}/eda/rulebooks"
  - "{{ callansible_dir }}/eda/inventory"
  - "{{ callansible_dir }}/eda/test_events"
  - "{{ callansible_dir }}/openprose/schemas"
  - "{{ callansible_dir }}/daytona"
  - "{{ callansible_dir }}/aap-data"
